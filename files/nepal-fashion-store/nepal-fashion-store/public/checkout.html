<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Checkout - SRS Fashion Store</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="navbar">
        <a href="index.html" class="logo">SRS Fashion Store</a>

<nav>
  <a href="index.html">Home</a>
  <a href="cart.html">🛒 Cart (<span id="cart-count">0</span>)</a>
</nav>


  </header>

  <main class="checkout-page">


<div class="checkout-heading">
  <span>CHECKOUT</span>
  <h2>Complete Your Order</h2>
  <p>Enter your details and choose your payment method.</p>
</div>


<div class="checkout-container">

  <!-- Checkout Form -->

  <section class="checkout-form">

    <h3>Delivery Information</h3>

    <form id="checkout-form">

      <label for="fullname">Full Name</label>
      <input
        type="text"
        id="fullname"
        name="fullname"
        placeholder="Enter your full name"
        required
      >

      <label for="phone">Phone Number</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="98XXXXXXXX"
        required
      >

      <label for="address">Address</label>
      <textarea
        id="address"
        name="address"
        placeholder="Enter your delivery address"
        required
      ></textarea>

      <label for="city">City</label>
      <input
        type="text"
        id="city"
        name="city"
        placeholder="e.g. Kathmandu"
        required
      >

      <label for="payment">Payment Method</label>

      <select id="payment" name="payment" required>
        <option value="Cash on Delivery">Cash on Delivery</option>
        <option value="eSewa">eSewa</option>
        <option value="Khalti">Khalti</option>
      </select>

      <button type="submit" class="place-order-btn">
        Place Order →
      </button>

    </form>

  </section>


  <!-- Order Summary -->

  <section class="checkout-summary">

    <h3>Order Summary</h3>

    <div id="checkout-items"></div>

    <div class="checkout-summary-line">
      <span>Items</span>
      <span id="checkout-item-count">0</span>
    </div>

    <div class="checkout-summary-line total">
      <span>Total</span>
      <strong id="checkout-total">Rs. 0</strong>
    </div>

    <p class="secure-text">
      🔒 Secure checkout
    </p>

    <a href="cart.html" class="back-cart">
      ← Back to Cart
    </a>

  </section>

</div>


<div id="order-confirmation"></div>


  </main>

  <script src="script.js"></script>

  <script>

    showCheckoutSummary();
    updateCartCount();

    document
      .getElementById("checkout-form")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        placeOrder();

      });

  </script>

</body>
</html>
