<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Successful - SRS Fashion Store</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">

        <a href="index.html" class="logo">
            SRS Fashion Store
        </a>

        <div class="nav-links">

            <a href="index.html">
                Store
            </a>

            <a href="purchase-history.html">
                Purchase History
            </a>

        </div>

    </nav>


    <main class="payment-result">

        <div class="payment-box">

            <h1>Payment Successful!</h1>

            <p>
                Your eSewa payment was successfully verified.
            </p>

            <p id="order-number"></p>

            <div class="payment-buttons">

                <a href="purchase-history.html">
                    View Purchase History
                </a>

                <a href="index.html">
                    Continue Shopping
                </a>

            </div>

        </div>

    </main>


<script>
    const params =
        new URLSearchParams(window.location.search);

    const order =
        params.get("order");

    if (order) {
        document.getElementById("order-number")
            .textContent =
            "Order Number: " + order;
    }

    // Clear cart after successful eSewa payment
    localStorage.removeItem("cart");
    
</script>

</body>

</html>
